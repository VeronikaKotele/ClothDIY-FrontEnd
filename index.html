<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>BodyBuilder</title>
        <link rel="stylesheet" href="src/css/styles.css">
        <link rel="icon" type="image/svg+xml" href="./public/icons/zoom-reset-svgrepo-com.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="bodyBuilderContainer">
            <div class="canvas3DContainer">
                <canvas id="bodyBuilderCanvas"></canvas>
                <div class="canvas3DControls">
                    <button id="resetCameraButton" class="transparentButton"  aria-label="Скинути камеру до стандартного вигляду">
                        <svg class="icon" width="30" height="30" aria-hidden="true">
                            <use href="./public/icons/zoom-reset-svgrepo-com.svg#i-zoom-reset"></use>
                        </svg>
                    </button>
                    <button id="camera-projection-mode" class="transparentButton" aria-label="Перемкнути режим проекції: перспективна або ортографічна">
                        <svg class="icon" width="30" height="30" aria-hidden="true">
                            <use href="./public/icons/projection.svg#i-projection"></use>
                        </svg>
                    </button>
                    <button id="camera-position-top" class="transparentButton" aria-label="Дивитися зверху">
                        <svg class="icon view-orientation-icon" width="30" height="30" aria-hidden="true">
                            <use href="./public/icons/cube.svg#i-cube"></use>
                        </svg>
                    </button>
                    <button id="camera-position-front" class="transparentButton" aria-label="Дивитися спереду">
                        <svg class="icon view-orientation-icon" width="30" height="30" aria-hidden="true">
                            <use href="./public/icons/cube.svg#i-cube"></use>
                        </svg>
                    </button>
                    <button id="camera-position-side" class="transparentButton" aria-label="Дивитися з боку">
                        <svg class="icon view-orientation-icon" width="30" height="30" aria-hidden="true" >
                            <use href="./public/icons/cube.svg#i-cube"></use>
                        </svg>
                    </button>
                    <button id="openBodyInputsPannel" class="transparentButton" style="display: none;" aria-label="Відкрити панель введення параметрів тіла">
                        <svg class="icon" width="30" height="30" aria-hidden="true">
                            <use href="./public/icons/sliders.svg#i-slider"></use>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="inputsContainer" id="bodyInputsPannel">
                <button id="closeBodyInputsPannel" class="toggleSidePannelButton" aria-label="Закрити панель введення параметрів тіла">
                    <svg class="icon" width="30" height="30" aria-hidden="true">
                        <use href="./public/icons/angles-right.svg#i-angles-right"></use>
                    </svg>
                </button>

                <div class="inputsContainerScrollArea">
                    <form class="body-parameters-input-form" data-body-parameters-input-form>
                        <label class="" for="height">Висота</label>
                        <div class="input-with-unit">
                            <input class="" type="number" id="height" name="height" />
                            <span class="input-unit">cm</span>
                        </div>

                        <label class="" for="bust-circumference">Обхват грудей</label>
                        <div class="input-with-unit">
                            <input class="" type="number" id="bust-circumference" name="bust-circumference" />
                            <span class="input-unit">cm</span>
                        </div>
                        
                        <label class="" for="waist-circumference">Обхват талії</label>
                        <div class="input-with-unit">
                            <input class="" type="number" id="waist-circumference" name="waist-circumference" />
                            <span class="input-unit">cm</span>
                        </div>
                        
                        <label class="" for="hip-circumference">Обхват стегон</label>
                        <div class="input-with-unit">
                            <input class="" type="number" id="hip-circumference" name="hip-circumference" />
                            <span class="input-unit">cm</span>
                        </div>
                        
                        <label class="" for="sleeve-length">Довжина рукава</label>
                        <div class="input-with-unit">
                            <input class="" type="number" id="sleeve-length" name="sleeve-length" />
                            <span class="input-unit">cm</span>
                        </div>

                        <button class="search-formButton" type="submit" disabled aria-label="Save">
                            Зберегти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
